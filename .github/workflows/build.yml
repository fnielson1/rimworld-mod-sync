name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Source/ModSync.csproj -c Release

      - name: Package mod
        run: |
          mkdir -p dist/ModSync
          cp -r About 1.6 dist/ModSync/

      - uses: actions/upload-artifact@v7
        with:
          name: ModSync
          path: dist/
